name: Build Windows plugin
on:
  push:
    branches: [StartHere, main, master]
  workflow_dispatch:
    inputs:
      template_ref:
        description: Official obsproject/obs-plugintemplate revision
        required: true
        default: 3e7d7ac3b5342cd7d9b88890b9c70b472d1520fc
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Camera-Pop-Out-Native
    steps:
      - uses: actions/checkout@v4
      - name: Test crop calculations
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /EHsc /std:c++17 tests\crop_test.cpp /Fe:crop-test.exe && crop-test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Crop tests failed' }
      - name: Build native DLL and package
        shell: pwsh
        env:
          TEMPLATE_REF: ${{ inputs.template_ref || '3e7d7ac3b5342cd7d9b88890b9c70b472d1520fc' }}
        run: ./build-windows.ps1 -TemplateRef $env:TEMPLATE_REF
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Pop-Out-Native-Windows
          path: Camera-Pop-Out-Native/Camera-Pop-Out-Native-Windows.zip
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-log
          path: Camera-Pop-Out-Native/build-log.txt
          if-no-files-found: ignore
